# This workflow builds a separate local-install app for the fork.
name: fork-macos

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    if: github.repository == 'steven-forresttechnologies/rakazo'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node apps/desktop/scripts/build-fork-macos.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rakazo-ft-macos-arm64
          path: |
            apps/desktop/out/fork-macos/*.dmg
            apps/desktop/out/fork-macos/*.zip
          if-no-files-found: error
