# Fork-only: builds the Android app and publishes over-the-air updates into this fork's own
# Expo project. It rewrites the app's identity in the runner's checkout only, so app.json stays
# identical to upstream and syncing never conflicts. Never send this file upstream.
name: fork-mobile

on:
  workflow_dispatch:
    inputs:
      action:
        description: "apk builds a new installable APK; update publishes an over-the-air update"
        type: choice
        options: [update, apk]
        default: update
      message:
        description: "Update message (optional)"
        type: string
        required: false
  # Every push to main that touches app code ships it to installed APKs over the air.
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - "pnpm-lock.yaml"

permissions:
  contents: read

concurrency:
  group: fork-mobile
  cancel-in-progress: false

env:
  EXPO_OWNER: forresttechnologies
  EXPO_SLUG: rakazo-ft-mobile
  APP_NAME: Rakazo FT
  # Its own package name, so it installs beside the official app instead of clashing with it.
  ANDROID_PACKAGE: com.forresttechnologies.rakazo

jobs:
  mobile:
    name: ${{ github.event.inputs.action == 'apk' && 'Build Android APK' || 'Publish OTA update' }}
    if: github.repository != 'elie222/rakazo'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Require fork settings
        env:
          EXPO_TOKEN: ${{ secrets.FORK_EXPO_TOKEN }}
          EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
          API_URL: ${{ vars.RAKAZO_API_URL }}
        run: |
          missing=()
          [[ -n "$EXPO_TOKEN" ]] || missing+=("secret FORK_EXPO_TOKEN")
          # The project's ID, not its name: expo.dev > project > Settings shows it.
          [[ "$EXPO_PROJECT_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] ||
            missing+=("variable EXPO_PROJECT_ID (the project ID, like 07f7eb04-45e3-47fe-9374-99a2f991131e, not its name)")
          [[ "$API_URL" == https://* ]] || missing+=("variable RAKAZO_API_URL (https://...)")
          if (( ${#missing[@]} )); then
            printf 'Add under Settings > Secrets and variables > Actions: %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - name: Set up Expo
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9
        with:
          eas-version: latest
          packager: pnpm
          token: ${{ secrets.FORK_EXPO_TOKEN }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck mobile
        run: pnpm --filter @rakazo/mobile exec tsc --noEmit -p tsconfig.json

      - name: Point the app at this fork's Expo project
        working-directory: apps/mobile
        env:
          EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
        run: |
          set -euo pipefail
          jq --arg owner "$EXPO_OWNER" --arg slug "$EXPO_SLUG" --arg name "$APP_NAME" \
            --arg pkg "$ANDROID_PACKAGE" --arg id "$EXPO_PROJECT_ID" '
              .expo.owner = $owner | .expo.slug = $slug | .expo.name = $name
              | .expo.android.package = $pkg
              | .expo.extra.eas.projectId = $id
              | .expo.updates.url = "https://u.expo.dev/\($id)"
            ' app.json > app.json.next
          mv app.json.next app.json
          jq '.expo | {owner, slug, name, package: .android.package, projectId: .extra.eas.projectId, version}' app.json

      # Release builds read the server URL from the EAS production environment.
      - name: Set the server URL on EAS
        working-directory: apps/mobile
        env:
          API_URL: ${{ vars.RAKAZO_API_URL }}
        run: |
          eas env:create --environment production --name EXPO_PUBLIC_API_URL --value "$API_URL" \
            --visibility plaintext --force --non-interactive

      # EAS keeps the signing keystore; the first build creates it. Back it up with
      # `eas credentials` (Android > Keystore > Download), or installed copies can never update.
      - name: Build APK on EAS
        if: github.event.inputs.action == 'apk'
        working-directory: apps/mobile
        env:
          # Upload the rewritten working tree, not the committed app.json.
          EAS_NO_VCS: "1"
        run: |
          set -euo pipefail
          eas build --platform android --profile android-apk --non-interactive --wait --json > "$RUNNER_TEMP/build.json"
          url="$(jq -r '.[0].artifacts.applicationArchiveUrl // .[0].artifacts.buildUrl' "$RUNNER_TEMP/build.json")"
          version="$(jq -r '.[0].appVersion' "$RUNNER_TEMP/build.json")"
          {
            echo "### Android APK $version"
            echo ""
            echo "[Download rakazo.apk]($url). Open it on your phone to install."
          } >> "$GITHUB_STEP_SUMMARY"

      # Installed APKs download it on launch and apply it on the next restart. It only reaches
      # builds with the same app version; after a version bump, build a new APK.
      - name: Publish OTA update
        if: github.event.inputs.action != 'apk'
        working-directory: apps/mobile
        env:
          EAS_NO_VCS: "1"
          MESSAGE: ${{ github.event.inputs.message || github.event.head_commit.message || 'Update' }}
        run: |
          set -euo pipefail
          eas update --platform android --channel production --environment production \
            --non-interactive --message "$(head -n1 <<< "$MESSAGE")"
